<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SECTOR Dev</title>
<style>
  :root { --bg: #0b1117; --panel: #121c25; --line: #23323f; --ink: #e9edf2; --dim: #8fa1b3; --gold: #ffc53d; --green: #59f08a; --red: #ff4f5e; --blue: #36a3ff; }
  * { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: 3px; } header .sub { color: var(--dim); font-size: 12px; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 14px; padding: 14px 16px 40px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  section.wide { grid-column: 1 / -1; } h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: 2px; color: var(--gold); }
  .kpis { display: flex; flex-wrap: wrap; gap: 10px; } .kpi { background: #0e171f; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 110px; }
  .kpi b { display: block; font-size: 20px; } .kpi span { color: var(--dim); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; } th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; } th { color: var(--dim); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .bar { display: grid; grid-template-columns: 110px 1fr 70px; gap: 8px; align-items: center; font-size: 13px; margin: 3px 0; }
  .bar i { display: block; height: 10px; border-radius: 5px; background: var(--blue); } .bar em { font-style: normal; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
  button, input, select { font: inherit; color: var(--ink); background: #0e171f; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; } button { cursor: pointer; } button:hover { border-color: var(--blue); }
  button.warn { border-color: var(--red); color: var(--red); } .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
  .dim { color: var(--dim); } .ok { color: var(--green); } .bad { color: var(--red); }
  #login { max-width: 360px; margin: 18vh auto; } #msg { min-height: 20px; }
  @media (max-width: 500px) { main { grid-template-columns: 1fr; padding: 10px; } }
</style></head>
<body>
<div id="login"><section><h2>SECTOR DEV</h2><p class="dim">Enter the dev key this server was started with (SECTOR_DEV_KEY).</p><div class="row"><input id="key" type="password" placeholder="dev key" style="flex:1"><button id="go">OPEN</button></div><div id="lerr" class="bad"></div></section></div>
<div id="app" hidden>
<header><h1>SECTOR · DEV</h1><span class="sub" id="hdr"></span><span id="msg" class="ok" style="margin-left:auto"></span><button id="out">LOCK</button></header>
<main>
  <section class="wide"><h2>SERVER</h2><div class="kpis" id="kpis"></div></section>
  <section class="wide"><h2>LIVE GAME</h2><div id="game"></div></section>
  <section><h2>FACTION WIN RATE</h2><div id="factions"></div></section>
  <section><h2>MOST DEPLOYED UNITS</h2><div id="deploys"></div></section>
  <section class="wide"><h2>RECENT GAMES</h2><div id="recent"></div></section>
  <section class="wide"><h2>PROFILES</h2><div class="row"><input id="pq" placeholder="search name, id or recruit code" style="flex:1"><button id="pgo">SEARCH</button></div><div id="profiles"></div></section>
  <section><h2>LOBBY</h2><div id="lobby"></div></section>
  <section><h2>TODAY'S STORE</h2><div id="store"></div></section>
</main></div>
<script>
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let key = sessionStorage.getItem('sector.devkey') || '', timer = null;
async function api(route, body) {
  const r = await fetch('/dev/api/' + route, { method: body ? 'POST' : 'GET', headers: { 'x-dev-key': key, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.err || r.status); return j;
}
const flash = (t, bad) => { const m = $('#msg'); m.textContent = t; m.className = bad ? 'bad' : 'ok'; clearTimeout(flash.t); flash.t = setTimeout(() => m.textContent = '', 3000); };
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 60 ? m + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; };
const bars = (rows, fmt) => { const max = Math.max(1, ...rows.map(r => r[1])); return rows.map(([k, v, extra]) => `<div class="bar"><span>${esc(k)}</span><i style="width:${Math.max(2, v / max * 100)}%"></i><em>${fmt ? fmt(v, extra) : v}</em></div>`).join('') || '<div class="dim">No data yet: finish a game.</div>'; };
async function refresh() {
  let o; try { o = await api('overview'); } catch (e) { if (String(e.message) === 'wrong key') return lock('Wrong key'); return flash('Server unreachable', true); }
  $('#hdr').textContent = 'v' + o.version + ' · up ' + Math.round(o.uptime / 60000) + ' min';
  const k = (v, l) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`;
  $('#kpis').innerHTML = k(o.connections, 'connections') + k(o.memory + ' MB', 'memory') + k(o.profiles.profiles, 'profiles') + k(o.profiles.coins.toLocaleString(), 'coins held') + k(o.profiles.owned, 'skins owned') + k(o.analytics.games, 'games logged') + k(o.analytics.avgRounds, 'avg rounds') + k(o.analytics.games ? Math.round(o.analytics.botWins / o.analytics.games * 100) + '%' : '—', 'won by bots');
  const g = o.game;
  $('#game').innerHTML = !g ? '<div class="dim">No game running.</div>' : `<div class="row"><b>${esc(g.mode)}</b><span class="dim">round ${g.round} · ${esc(g.phase)} · ${esc(g.turn || '')}'s turn${g.paused ? ' · PAUSED' : ''}</span><span style="margin-left:auto"></span><button data-act="pause">${g.paused ? 'RESUME' : 'PAUSE'}</button><a href="/?watch=1" target="_blank"><button>👁 SPECTATE</button></a><button class="warn" data-act="end">END GAME</button></div>
    <table><tr><th>Commander</th><th class="num">Cash</th><th class="num">Income</th><th class="num">Land</th><th class="num">Units</th><th class="num">Kills</th><th>Give cash</th></tr>${g.players.map(p => `<tr class="${p.alive ? '' : 'dim'}"><td>${esc(p.name)}${p.bot ? ' <span class="dim">bot</span>' : ''}</td><td class="num">$${p.cash}</td><td class="num">$${p.income}</td><td class="num">${p.land}</td><td class="num">${p.army}</td><td class="num">${p.kills}</td><td><button data-cash="${p.id}" data-amt="10">+10</button> <button data-cash="${p.id}" data-amt="50">+50</button> <button data-cash="${p.id}" data-amt="-10">−10</button></td></tr>`).join('')}</table>`;
  $('#factions').innerHTML = bars(Object.entries(o.analytics.factions).map(([f, v]) => [f, v.played ? v.won / v.played * 100 : 0, v]).sort((a, b) => b[1] - a[1]), (v, x) => Math.round(v) + '% of ' + x.played);
  $('#deploys').innerHTML = bars(Object.entries(o.analytics.deploys).sort((a, b) => b[1] - a[1]).slice(0, 14));
  $('#recent').innerHTML = o.analytics.recent.length ? `<table><tr><th>When</th><th>Mode</th><th class="num">Rounds</th><th class="num">Players</th><th>Winner</th><th>How</th></tr>${o.analytics.recent.map(r => `<tr><td>${ago(r.at)}</td><td>${esc(r.mode)}</td><td class="num">${r.rounds}</td><td class="num">${r.players}</td><td>${r.winner ? esc(r.winner.faction) + (r.winner.bot ? ' bot (' + esc(r.winner.diff) + ')' : ' human') : '—'}</td><td class="dim">${esc(r.reason || '')}</td></tr>`).join('')}</table>` : '<div class="dim">No finished games yet.</div>';
  $('#lobby').innerHTML = `<table>${o.lobby.map(p => `<tr><td>${esc(p.name)}</td><td class="dim">${p.bot ? 'bot · ' + esc(p.diff) : p.spectator ? 'spectating' : 'human'}</td><td class="${p.connected ? 'ok' : 'bad'}">${p.connected ? 'online' : 'offline'}</td><td class="dim">${esc(p.profile || '')}</td></tr>`).join('')}</table>`;
  $('#store').innerHTML = `<div class="dim">${esc(o.store.day)}</div>` + o.store.items.map(i => `<div>${esc(i)}</div>`).join('');
}
async function profiles() {
  const { profiles } = await api('profiles', { q: $('#pq').value });
  $('#profiles').innerHTML = profiles.length ? `<table><tr><th>Name</th><th>Id</th><th class="num">Coins</th><th class="num">Skins</th><th class="num">Games</th><th class="num">Wins</th><th class="num">Recruits</th><th>Joined</th><th></th></tr>${profiles.map(p => `<tr><td>${esc(p.name || '—')}${p.inGame ? ' <span class="ok">● in game</span>' : ''}</td><td class="dim">${esc(p.id.slice(0, 10))}…</td><td class="num">${p.coins.toLocaleString()}</td><td class="num">${p.owned}</td><td class="num">${p.games}</td><td class="num">${p.wins}</td><td class="num">${p.recruits}</td><td>${ago(p.created)}</td><td>${p.inGame ? '<a href="/?watch=1" target="_blank"><button>👁 SPECTATE</button></a> ' : ''}<button data-grant="${p.id}">+500 coins</button> <button data-give="${p.id}">give skin…</button></td></tr>`).join('')}</table>` : '<div class="dim">No profiles found.</div>';
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  try {
    if (b.dataset.act === 'pause') { await api('pause', { on: b.textContent === 'PAUSE' }); flash('Done'); }
    else if (b.dataset.act === 'end') { if (!confirm('End the game for everyone?')) return; await api('end', {}); flash('Game ended'); }
    else if (b.dataset.cash) { await api('cash', { pid: b.dataset.cash, amount: +b.dataset.amt }); flash('Cash adjusted'); }
    else if (b.dataset.grant) { await api('grant', { profile: b.dataset.grant, coins: 500 }); flash('+500 coins'); profiles(); }
    else if (b.dataset.give) { const item = prompt('Item id (e.g. t-usa, b-gold, n-founder, c-mauler-gilded)'); if (!item) return; await api('give', { profile: b.dataset.give, item }); flash('Given ' + item); profiles(); }
    else return;
    refresh();
  } catch (err) { flash(err.message, true); }
});
function lock(why) { sessionStorage.removeItem('sector.devkey'); key = ''; clearInterval(timer); $('#app').hidden = true; $('#login').hidden = false; $('#lerr').textContent = why || ''; }
async function unlock() { $('#login').hidden = true; $('#app').hidden = false; await refresh(); profiles().catch(() => {}); clearInterval(timer); timer = setInterval(refresh, 5000); }
$('#go').onclick = () => { key = $('#key').value.trim(); if (!key) return; sessionStorage.setItem('sector.devkey', key); unlock(); };
$('#key').onkeydown = e => { if (e.key === 'Enter') $('#go').click(); };
$('#pgo').onclick = () => profiles().catch(err => flash(err.message, true)); $('#pq').onkeydown = e => { if (e.key === 'Enter') $('#pgo').click(); };
$('#out').onclick = () => lock();
if (key) unlock();
</script>
</body></html>
